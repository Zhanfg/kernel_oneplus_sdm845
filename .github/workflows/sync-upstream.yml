name: Check OnePlus 6 Upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * 0"
  push:
    branches: [master]
    paths:
      - ".github/workflows/sync-upstream.yml"
      - "UPSTREAM_BASELINE.env"

permissions:
  contents: read

concurrency:
  group: oneplus6-upstream-check
  cancel-in-progress: true

jobs:
  check:
    if: github.repository == 'Zhanfg/kernel_oneplus_sdm845'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout baseline metadata
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check original upstream HEAD
        shell: bash
        run: |
          set -euo pipefail

          # shellcheck disable=SC1091
          source UPSTREAM_BASELINE.env

          CURRENT_SHA="$(git ls-remote \
            "https://github.com/${PRIMARY_UPSTREAM_REPOSITORY}.git" \
            "refs/heads/${PRIMARY_UPSTREAM_BRANCH}" | awk '{print $1}')"

          if [ -z "${CURRENT_SHA}" ]; then
            echo "Unable to resolve the original upstream branch." >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi

          {
            echo "# OnePlus 6 upstream check"
            echo
            echo "- Repository: \`${PRIMARY_UPSTREAM_REPOSITORY}\`"
            echo "- Branch: \`${PRIMARY_UPSTREAM_BRANCH}\`"
            echo "- Recorded baseline: \`${PRIMARY_UPSTREAM_SHA}\`"
            echo "- Current upstream HEAD: \`${CURRENT_SHA}\`"
            echo "- Checked at: \`$(date -u '+%Y-%m-%dT%H:%M:%SZ')\`"
            echo
          } >> "${GITHUB_STEP_SUMMARY}"

          if [ "${CURRENT_SHA}" = "${PRIMARY_UPSTREAM_SHA}" ]; then
            echo "Original upstream has no new commits. The recorded baseline is current." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          {
            echo "## Manual review required"
            echo
            echo "The original upstream branch moved. Do not merge or overwrite master automatically."
            echo "Review the new commit range, update UPSTREAM_BASELINE.env only after source audit, and port changes through a dedicated PR."
          } >> "${GITHUB_STEP_SUMMARY}"

          echo "::error::Original OnePlus 6 upstream changed from ${PRIMARY_UPSTREAM_SHA} to ${CURRENT_SHA}"
          exit 1
