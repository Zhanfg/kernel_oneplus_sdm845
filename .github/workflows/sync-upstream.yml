name: Sync 4.19 Upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * 0"
  push:
    branches: [master]
    paths:
      - ".github/workflows/sync-upstream.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: oneplus6-upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://github.com/EdwinMoq/android_kernel_oneplus_sdm845.git
  UPSTREAM_BRANCH: lineage-23.2-4.19

jobs:
  sync:
    if: github.repository == 'Zhanfg/kernel_oneplus_sdm845'
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git and fetch upstream
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote remove upstream 2>/dev/null || true
          git remote add upstream "${UPSTREAM_REPO}"
          git fetch --no-tags --prune upstream \
            "+refs/heads/${UPSTREAM_BRANCH}:refs/remotes/upstream/${UPSTREAM_BRANCH}"

      - name: Build safe sync candidate
        id: sync
        shell: bash
        run: |
          set -euo pipefail

          LOCAL_SHA="$(git rev-parse HEAD)"
          UPSTREAM_REF="refs/remotes/upstream/${UPSTREAM_BRANCH}"
          UPSTREAM_SHA="$(git rev-parse "${UPSTREAM_REF}")"
          LOCAL_SHORT="${LOCAL_SHA:0:12}"
          UPSTREAM_SHORT="${UPSTREAM_SHA:0:12}"
          SYNC_DATE="$(date -u +%Y%m%d)"
          SYNC_BRANCH="sync/upstream-${SYNC_DATE}-${UPSTREAM_SHORT}-${LOCAL_SHORT}"
          REPORT="upstream-sync-report.md"

          echo "local_sha=${LOCAL_SHA}" >> "${GITHUB_OUTPUT}"
          echo "upstream_sha=${UPSTREAM_SHA}" >> "${GITHUB_OUTPUT}"
          echo "sync_branch=${SYNC_BRANCH}" >> "${GITHUB_OUTPUT}"

          set_outputs() {
            echo "result=$1" >> "${GITHUB_OUTPUT}"
            echo "strategy=$2" >> "${GITHUB_OUTPUT}"
            echo "conflict=$3" >> "${GITHUB_OUTPUT}"
          }

          finish_problem() {
            local result="$1"
            local strategy="$2"
            shift 2
            {
              echo "## Result"
              echo
              printf '%s\n' "$@"
            } >> "${REPORT}"
            cat "${REPORT}" >> "${GITHUB_STEP_SUMMARY}"
            set_outputs "${result}" "${strategy}" "true"
            exit 0
          }

          kernel_version() {
            git show "$1:Makefile" | awk '
              /^VERSION =/ {v=$3}
              /^PATCHLEVEL =/ {p=$3}
              /^SUBLEVEL =/ {s=$3; print v "." p "." s; exit}
            '
          }

          {
            echo "# OnePlus 6 upstream sync report"
            echo
            echo "- Local base: \`${LOCAL_SHA}\`"
            echo "- Upstream: \`EdwinMoq/android_kernel_oneplus_sdm845:${UPSTREAM_BRANCH}\`"
            echo "- Upstream SHA: \`${UPSTREAM_SHA}\`"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
          } > "${REPORT}"

          MERGE_BASE="$(git merge-base HEAD "${UPSTREAM_REF}" 2>/dev/null || true)"

          if [ -n "${MERGE_BASE}" ]; then
            STRATEGY="merge"
            echo "- Common ancestor: \`${MERGE_BASE}\`" >> "${REPORT}"
            echo "- Strategy: normal Git merge" >> "${REPORT}"
            echo >> "${REPORT}"

            if git merge-base --is-ancestor "${UPSTREAM_REF}" HEAD; then
              {
                echo "## Result"
                echo
                echo "The local branch already contains the selected upstream commit."
              } >> "${REPORT}"
              cat "${REPORT}" >> "${GITHUB_STEP_SUMMARY}"
              set_outputs "up-to-date" "merge" "false"
              exit 0
            fi

            git switch -c "${SYNC_BRANCH}"
            set +e
            git merge --no-ff --no-edit "${UPSTREAM_REF}"
            STATUS=$?
            set -e

            if [ "${STATUS}" -ne 0 ]; then
              CONFLICTS="$(git diff --name-only --diff-filter=U || true)"
              {
                echo "## Conflicting files"
                echo
                if [ -n "${CONFLICTS}" ]; then
                  while IFS= read -r file; do echo "- \`${file}\`"; done <<< "${CONFLICTS}"
                else
                  echo "- Git stopped before producing a conflict list."
                fi
              } >> "${REPORT}"
              git merge --abort 2>/dev/null || true
              finish_problem "merge-conflict" "merge" \
                "The normal upstream merge has conflicts. Nothing was pushed."
            fi
          else
            STRATEGY="snapshot-replay"
            echo "- Common ancestor: none" >> "${REPORT}"
            echo "- Strategy: replay local net changes from the imported snapshot" >> "${REPORT}"
            echo >> "${REPORT}"

            mapfile -t ROOTS < <(git rev-list --max-parents=0 HEAD)
            if [ "${#ROOTS[@]}" -ne 1 ]; then
              finish_problem "ambiguous-root" "${STRATEGY}" \
                "The local repository has ${#ROOTS[@]} root commits, so an imported snapshot baseline cannot be selected automatically."
            fi

            LOCAL_ROOT="${ROOTS[0]}"
            ROOT_VERSION="$(kernel_version "${LOCAL_ROOT}" || true)"
            UPSTREAM_VERSION="$(kernel_version "${UPSTREAM_REF}" || true)"

            {
              echo "- Local root snapshot: \`${LOCAL_ROOT}\`"
              echo "- Local root kernel version: \`${ROOT_VERSION:-unknown}\`"
              echo "- Upstream kernel version: \`${UPSTREAM_VERSION:-unknown}\`"
              echo
            } >> "${REPORT}"

            if [ -z "${ROOT_VERSION}" ] || [ "${ROOT_VERSION}" != "${UPSTREAM_VERSION}" ]; then
              finish_problem "baseline-mismatch" "${STRATEGY}" \
                "The local root snapshot and selected upstream do not use the same kernel version. Automatic replay was stopped."
            fi

            PATCH_FILE="/tmp/abk-local-changes.patch"
            git diff --binary "${LOCAL_ROOT}" "${LOCAL_SHA}" -- . > "${PATCH_FILE}"
            if [ ! -s "${PATCH_FILE}" ]; then
              finish_problem "no-local-delta" "${STRATEGY}" \
                "No local changes were found after the imported root snapshot."
            fi

            git switch -c "${SYNC_BRANCH}" "${UPSTREAM_REF}"
            set +e
            git apply --3way --index --whitespace=nowarn "${PATCH_FILE}"
            STATUS=$?
            set -e

            if [ "${STATUS}" -ne 0 ]; then
              CONFLICTS="$(git diff --name-only --diff-filter=U || true)"
              GIT_STATUS="$(git status --short || true)"
              {
                echo "## Conflicting files"
                echo
                if [ -n "${CONFLICTS}" ]; then
                  while IFS= read -r file; do echo "- \`${file}\`"; done <<< "${CONFLICTS}"
                else
                  echo "- No unmerged index entries were reported."
                fi
                echo
                echo "## Git status"
                echo
                echo '```text'
                printf '%s\n' "${GIT_STATUS}"
                echo '```'
              } >> "${REPORT}"
              git reset --hard "${UPSTREAM_SHA}"
              git clean -fd
              finish_problem "replay-conflict" "${STRATEGY}" \
                "Replaying the local ABK delta onto upstream produced conflicts. Nothing was pushed."
            fi

            if git diff --cached --quiet; then
              finish_problem "empty-replay" "${STRATEGY}" \
                "The local delta produced no candidate changes after applying to upstream."
            fi

            git commit -m "chore: replay ABK local changes onto upstream ${UPSTREAM_SHORT}"
            REPLAY_SHA="$(git rev-parse HEAD)"
            CANDIDATE_TREE="$(git rev-parse "${REPLAY_SHA}^{tree}")"
            BRIDGE_SHA="$(printf '%s\n' \
              "chore: connect ABK history to upstream ${UPSTREAM_SHORT}" \
              "" \
              "Replayed ${LOCAL_ROOT}..${LOCAL_SHA} onto ${UPSTREAM_SHA}." | \
              git commit-tree "${CANDIDATE_TREE}" -p "${LOCAL_SHA}" -p "${REPLAY_SHA}")"
            git reset --hard "${BRIDGE_SHA}"
          fi

          CHANGE_COUNT="$(git diff --name-only "${LOCAL_SHA}" HEAD | awk 'END {print NR + 0}')"
          {
            echo "## Result"
            echo
            echo "A sync candidate was created without unresolved textual conflicts."
            echo
            echo "- Strategy: \`${STRATEGY}\`"
            echo "- Candidate branch: \`${SYNC_BRANCH}\`"
            echo "- Files changed relative to local master: ${CHANGE_COUNT}"
            echo
            echo "## First 200 changed paths"
            echo
            git diff --name-only "${LOCAL_SHA}" HEAD | sed -n '1,200p' | while IFS= read -r file; do
              echo "- \`${file}\`"
            done
            if [ "${CHANGE_COUNT}" -gt 200 ]; then
              echo
              echo "The list is truncated. Review the complete Draft PR diff."
            fi
          } >> "${REPORT}"

          cat "${REPORT}" >> "${GITHUB_STEP_SUMMARY}"
          set_outputs "clean-candidate" "${STRATEGY}" "false"

      - name: Upload sync report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-sync-report-${{ github.run_id }}
          path: upstream-sync-report.md
          if-no-files-found: warn

      - name: Push candidate branch
        if: steps.sync.outputs.result == 'clean-candidate'
        run: git push origin "HEAD:refs/heads/${{ steps.sync.outputs.sync_branch }}"

      - name: Create Draft pull request
        if: steps.sync.outputs.result == 'clean-candidate'
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_BRANCH: ${{ steps.sync.outputs.sync_branch }}
          LOCAL_SHA: ${{ steps.sync.outputs.local_sha }}
          UPSTREAM_SHA: ${{ steps.sync.outputs.upstream_sha }}
          STRATEGY: ${{ steps.sync.outputs.strategy }}
        shell: bash
        run: |
          set -euo pipefail
          EXISTING="$(gh pr list --base master --head "${SYNC_BRANCH}" --state open --json url --jq '.[0].url // empty')"
          if [ -n "${EXISTING}" ]; then
            echo "Existing PR: ${EXISTING}" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          {
            echo "## Upstream"
            echo
            echo "- Repository: \`EdwinMoq/android_kernel_oneplus_sdm845\`"
            echo "- Branch: \`${UPSTREAM_BRANCH}\`"
            echo "- Upstream SHA: \`${UPSTREAM_SHA}\`"
            echo "- Local base: \`${LOCAL_SHA}\`"
            echo "- Strategy: \`${STRATEGY}\`"
            echo
            echo "## Required validation"
            echo
            echo "This PR is only a candidate. Keep it Draft until Standard and PowerSave builds pass and ReSukiSU, SuSFS, BBG, networking, defconfig, DTS/DTBO and device functions are reviewed and tested."
          } > /tmp/upstream-pr-body.md

          gh pr create \
            --draft \
            --base master \
            --head "${SYNC_BRANCH}" \
            --title "chore: sync OnePlus 6 Linux 4.19 upstream" \
            --body-file /tmp/upstream-pr-body.md

      - name: Fail when manual work is required
        if: steps.sync.outputs.conflict == 'true'
        run: |
          echo "Upstream synchronization requires manual review. See the uploaded report."
          exit 1
