name: Sync 4.19 Upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * 0"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/sync-upstream.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: oneplus6-upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://github.com/EdwinMoq/android_kernel_oneplus_sdm845.git
  UPSTREAM_BRANCH: lineage-23.2-4.19

jobs:
  sync:
    if: github.repository == 'Zhanfg/kernel_oneplus_sdm845'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream "${UPSTREAM_REPO}"
          git fetch --no-tags --prune upstream "${UPSTREAM_BRANCH}"

      - name: Attempt safe merge
        id: merge
        shell: bash
        run: |
          set -euo pipefail

          LOCAL_SHA="$(git rev-parse HEAD)"
          UPSTREAM_REF="upstream/${UPSTREAM_BRANCH}"
          UPSTREAM_SHA="$(git rev-parse "${UPSTREAM_REF}")"
          SHORT_SHA="${UPSTREAM_SHA:0:12}"
          SYNC_DATE="$(date -u +%Y%m%d)"
          SYNC_BRANCH="sync/upstream-${SYNC_DATE}-${SHORT_SHA}"
          REPORT="upstream-sync-report.md"

          echo "local_sha=${LOCAL_SHA}" >> "${GITHUB_OUTPUT}"
          echo "upstream_sha=${UPSTREAM_SHA}" >> "${GITHUB_OUTPUT}"
          echo "sync_branch=${SYNC_BRANCH}" >> "${GITHUB_OUTPUT}"

          {
            echo "# OnePlus 6 upstream sync report"
            echo
            echo "- Local base: \`${LOCAL_SHA}\`"
            echo "- Upstream: \`EdwinMoq/android_kernel_oneplus_sdm845:${UPSTREAM_BRANCH}\`"
            echo "- Upstream SHA: \`${UPSTREAM_SHA}\`"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
          } > "${REPORT}"

          if ! MERGE_BASE="$(git merge-base HEAD "${UPSTREAM_REF}")"; then
            {
              echo "## Result"
              echo
              echo "No common ancestor was found. The repositories cannot be merged safely without a manual import strategy."
            } >> "${REPORT}"
            cat "${REPORT}" >> "${GITHUB_STEP_SUMMARY}"
            echo "result=no-common-ancestor" >> "${GITHUB_OUTPUT}"
            echo "has_changes=true" >> "${GITHUB_OUTPUT}"
            echo "conflict=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "- Merge base: \`${MERGE_BASE}\`" >> "${REPORT}"
          echo >> "${REPORT}"

          if git merge-base --is-ancestor "${UPSTREAM_REF}" HEAD; then
            {
              echo "## Result"
              echo
              echo "The local branch already contains the selected upstream commit."
            } >> "${REPORT}"
            cat "${REPORT}" >> "${GITHUB_STEP_SUMMARY}"
            echo "result=up-to-date" >> "${GITHUB_OUTPUT}"
            echo "has_changes=false" >> "${GITHUB_OUTPUT}"
            echo "conflict=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git switch -c "${SYNC_BRANCH}"

          set +e
          git merge --no-ff --no-edit "${UPSTREAM_REF}"
          MERGE_STATUS=$?
          set -e

          if [ "${MERGE_STATUS}" -ne 0 ]; then
            CONFLICTS="$(git diff --name-only --diff-filter=U || true)"
            {
              echo "## Result"
              echo
              echo "The upstream merge has conflicts. Nothing was pushed and master was not modified."
              echo
              echo "## Conflicting files"
              echo
              if [ -n "${CONFLICTS}" ]; then
                while IFS= read -r file; do
                  echo "- \`${file}\`"
                done <<< "${CONFLICTS}"
              else
                echo "- Git stopped before producing a normal conflict list. Check the merge output in this run."
              fi
            } >> "${REPORT}"
            cat "${REPORT}" >> "${GITHUB_STEP_SUMMARY}"
            git merge --abort 2>/dev/null || true
            echo "result=conflict" >> "${GITHUB_OUTPUT}"
            echo "has_changes=true" >> "${GITHUB_OUTPUT}"
            echo "conflict=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          {
            echo "## Result"
            echo
            echo "The upstream branch merged without textual conflicts. A Draft PR will be created for review and build verification."
            echo
            echo "## Commits introduced"
            echo
            git log --oneline --no-merges "${LOCAL_SHA}..HEAD" | sed 's/^/- `/' | sed 's/$/`/'
          } >> "${REPORT}"

          cat "${REPORT}" >> "${GITHUB_STEP_SUMMARY}"
          echo "result=clean-merge" >> "${GITHUB_OUTPUT}"
          echo "has_changes=true" >> "${GITHUB_OUTPUT}"
          echo "conflict=false" >> "${GITHUB_OUTPUT}"

      - name: Upload sync report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-sync-report-${{ github.run_id }}
          path: upstream-sync-report.md
          if-no-files-found: warn

      - name: Push sync branch
        if: steps.merge.outputs.result == 'clean-merge'
        run: |
          git push origin "${{ steps.merge.outputs.sync_branch }}"

      - name: Create Draft pull request
        if: steps.merge.outputs.result == 'clean-merge'
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_BRANCH: ${{ steps.merge.outputs.sync_branch }}
          LOCAL_SHA: ${{ steps.merge.outputs.local_sha }}
          UPSTREAM_SHA: ${{ steps.merge.outputs.upstream_sha }}
        run: |
          EXISTING="$(gh pr list --base master --head "${SYNC_BRANCH}" --state open --json url --jq '.[0].url // empty')"
          if [ -n "${EXISTING}" ]; then
            echo "Existing PR: ${EXISTING}" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          gh pr create \
            --draft \
            --base master \
            --head "${SYNC_BRANCH}" \
            --title "chore: sync OnePlus 6 Linux 4.19 upstream" \
            --body "## Upstream\n\n- Repository: \`EdwinMoq/android_kernel_oneplus_sdm845\`\n- Branch: \`${UPSTREAM_BRANCH}\`\n- Upstream SHA: \`${UPSTREAM_SHA}\`\n- Local base: \`${LOCAL_SHA}\`\n\n## Policy\n\nThis PR was created only because the normal Git merge completed without textual conflicts. It remains Draft and must not be merged until Standard and PowerSave builds pass and the local ReSukiSU, SuSFS, BBG, network, defconfig and device changes are reviewed."

      - name: Fail when manual conflict resolution is required
        if: steps.merge.outputs.conflict == 'true'
        run: |
          echo "Upstream synchronization requires manual conflict resolution. See the uploaded report."
          exit 1
