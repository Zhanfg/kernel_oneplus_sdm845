name: Diagnose 4.19 Upstream

on:
  pull_request:
    branches: [master]
    paths:
      - ".github/upstream-sync-probe"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Diagnose upstream relationship
        shell: bash
        env:
          UPSTREAM_REPO: https://github.com/EdwinMoq/android_kernel_oneplus_sdm845.git
          UPSTREAM_BRANCH: lineage-23.2-4.19
        run: |
          set -euo pipefail

          git config user.name "upstream-diagnostics"
          git config user.email "upstream-diagnostics@users.noreply.github.com"
          git remote add upstream "${UPSTREAM_REPO}"
          git fetch --no-tags upstream \
            "+refs/heads/${UPSTREAM_BRANCH}:refs/remotes/upstream/${UPSTREAM_BRANCH}"

          LOCAL_SHA="$(git rev-parse HEAD)"
          UPSTREAM_REF="refs/remotes/upstream/${UPSTREAM_BRANCH}"
          UPSTREAM_SHA="$(git rev-parse "${UPSTREAM_REF}")"
          MERGE_BASE="$(git merge-base HEAD "${UPSTREAM_REF}" 2>/dev/null || true)"

          {
            echo "# OnePlus 6 upstream diagnostics"
            echo
            echo "- Local SHA: \`${LOCAL_SHA}\`"
            echo "- Upstream SHA: \`${UPSTREAM_SHA}\`"
            echo "- Upstream branch: \`${UPSTREAM_BRANCH}\`"
          } | tee -a "${GITHUB_STEP_SUMMARY}"

          if [ -n "${MERGE_BASE}" ]; then
            echo "- Common ancestor: \`${MERGE_BASE}\`" | tee -a "${GITHUB_STEP_SUMMARY}"
            echo "- Strategy tested: normal merge" | tee -a "${GITHUB_STEP_SUMMARY}"

            git switch -c diagnostics/normal-merge
            set +e
            git merge --no-commit --no-ff "${UPSTREAM_REF}"
            STATUS=$?
            set -e

            if [ "${STATUS}" -ne 0 ]; then
              echo "" | tee -a "${GITHUB_STEP_SUMMARY}"
              echo "## Merge conflicts" | tee -a "${GITHUB_STEP_SUMMARY}"
              git diff --name-only --diff-filter=U | sed 's/^/- `/' | sed 's/$/`/' | tee -a "${GITHUB_STEP_SUMMARY}"
              exit 1
            fi

            echo "" | tee -a "${GITHUB_STEP_SUMMARY}"
            echo "Normal merge completed without textual conflicts." | tee -a "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          mapfile -t ROOTS < <(git rev-list --max-parents=0 HEAD)
          echo "- Common ancestor: none" | tee -a "${GITHUB_STEP_SUMMARY}"
          echo "- Local root count: ${#ROOTS[@]}" | tee -a "${GITHUB_STEP_SUMMARY}"
          echo "- Strategy tested: exact tree match + commit replay" | tee -a "${GITHUB_STEP_SUMMARY}"

          if [ "${#ROOTS[@]}" -ne 1 ]; then
            echo "Cannot select a unique imported snapshot baseline." | tee -a "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi

          LOCAL_ROOT="${ROOTS[0]}"
          ROOT_TREE="$(git rev-parse "${LOCAL_ROOT}^{tree}")"
          ROOT_VERSION="$(git show "${LOCAL_ROOT}:Makefile" | awk '/^VERSION =/ {v=$3} /^PATCHLEVEL =/ {p=$3} /^SUBLEVEL =/ {print v "." p "." $3; exit}')"
          UPSTREAM_VERSION="$(git show "${UPSTREAM_REF}:Makefile" | awk '/^VERSION =/ {v=$3} /^PATCHLEVEL =/ {p=$3} /^SUBLEVEL =/ {print v "." p "." $3; exit}')"

          {
            echo "- Local root: \`${LOCAL_ROOT}\`"
            echo "- Local root tree: \`${ROOT_TREE}\`"
            echo "- Local root kernel: \`${ROOT_VERSION:-unknown}\`"
            echo "- Upstream kernel: \`${UPSTREAM_VERSION:-unknown}\`"
            echo
            echo "Searching upstream history for an identical source tree..."
          } | tee -a "${GITHUB_STEP_SUMMARY}"

          TREE_MATCH="$(git log --format='%H %T' "${UPSTREAM_REF}" | awk -v tree="${ROOT_TREE}" '$2 == tree {print $1; exit}')"

          if [ -z "${TREE_MATCH}" ]; then
            echo "" | tee -a "${GITHUB_STEP_SUMMARY}"
            echo "No upstream commit has a tree exactly matching the imported local root." | tee -a "${GITHUB_STEP_SUMMARY}"
            echo "Automatic history reconstruction is unsafe; a manual baseline audit is required." | tee -a "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi

          LOCAL_COMMIT_COUNT="$(git rev-list --count "${LOCAL_ROOT}..${LOCAL_SHA}")"
          LOCAL_MERGE_COUNT="$(git rev-list --count --merges "${LOCAL_ROOT}..${LOCAL_SHA}")"

          {
            echo ""
            echo "## Exact baseline match"
            echo
            echo "- Matching upstream commit: \`${TREE_MATCH}\`"
            echo "- Local commits after snapshot: ${LOCAL_COMMIT_COUNT}"
            echo "- Local merge commits after snapshot: ${LOCAL_MERGE_COUNT}"
          } | tee -a "${GITHUB_STEP_SUMMARY}"

          if [ "${LOCAL_MERGE_COUNT}" -ne 0 ]; then
            echo "Local history contains merge commits; automatic linear replay was stopped." | tee -a "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi

          mapfile -t LOCAL_COMMITS < <(git rev-list --reverse "${LOCAL_ROOT}..${LOCAL_SHA}")
          git switch -c diagnostics/commit-replay "${UPSTREAM_REF}"

          for commit in "${LOCAL_COMMITS[@]}"; do
            SUBJECT="$(git show -s --format=%s "${commit}")"
            echo "Replaying ${commit:0:12}: ${SUBJECT}"
            set +e
            git cherry-pick -x "${commit}"
            STATUS=$?
            set -e

            if [ "${STATUS}" -ne 0 ]; then
              {
                echo ""
                echo "## Replay stopped"
                echo
                echo "- Commit: \`${commit}\`"
                echo "- Subject: ${SUBJECT}"
                echo ""
                echo "### Conflicting files"
                echo
              } | tee -a "${GITHUB_STEP_SUMMARY}"

              CONFLICTS="$(git diff --name-only --diff-filter=U || true)"
              if [ -n "${CONFLICTS}" ]; then
                while IFS= read -r file; do echo "- \`${file}\`"; done <<< "${CONFLICTS}" | tee -a "${GITHUB_STEP_SUMMARY}"
              else
                echo "- No unmerged index entries; inspect the cherry-pick output." | tee -a "${GITHUB_STEP_SUMMARY}"
              fi
              exit 1
            fi
          done

          CHANGED="$(git diff --name-only "${LOCAL_SHA}" HEAD | awk 'END {print NR + 0}')"
          {
            echo ""
            echo "## Replay result"
            echo
            echo "All local commits replayed onto the current upstream without textual conflicts."
            echo "- Files changed relative to local master: ${CHANGED}"
          } | tee -a "${GITHUB_STEP_SUMMARY}"
